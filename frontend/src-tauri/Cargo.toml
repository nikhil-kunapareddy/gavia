[package]
name = "gavia"
version = "0.1.0"
description = "Gavia — loon detection for the field"
authors = ["Humanitarians AI"]
# Inherited from the model, which descends from Ultralytics YOLO11.
license = "AGPL-3.0"
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "gavia_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.11.3", features = [] }
tauri-plugin-log = "2"

# The per-launch token handed to the sidecar and injected into the webview.
uuid = { version = "1.20.0", features = ["v4"] }

# Readiness polling only, against 127.0.0.1 over plain HTTP. Default features
# drag in rustls and a root-certificate bundle to talk to an internet this
# process never touches.
ureq = { version = "3.4.2", default-features = false }
