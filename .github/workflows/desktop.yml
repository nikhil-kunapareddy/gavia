name: Desktop

# Every push to main or dev and every pull request is checked on all three
# systems and produces installers you can download from the run's summary.
# Pushing a `v*` tag skips the checks (the tagged commit already passed them)
# and attaches the installers to the release `npm run release` created.
on:
  push:
    branches: [main, dev]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

defaults:
  run:
    working-directory: desktop

jobs:
  frontend:
    name: frontend
    if: ${{ !startsWith(github.ref, 'refs/tags/') }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check
      - run: npm run test:coverage
      - run: npx vite build

  rust:
    name: rust (${{ matrix.name }})
    if: ${{ !startsWith(github.ref, 'refs/tags/') }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: macOS, os: macos-15 }
          - { name: Windows, os: windows-2025 }
          - { name: Linux, os: ubuntu-24.04 }
    runs-on: ${{ matrix.os }}
    env:
      RUSTFLAGS: -D warnings
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-desktop-build
      # tauri::generate_context! embeds the built frontend, so it has to exist.
      - run: npx vite build
      - name: cargo fmt
        if: runner.os == 'Linux'
        working-directory: desktop/src-tauri
        run: cargo fmt --check
      - name: cargo clippy
        working-directory: desktop/src-tauri
        run: cargo clippy --locked --all-targets
      # Includes the real-model and workflow tests. The parity test against the
      # Python reference needs the loonnet dataset and skips itself here.
      - name: cargo test
        working-directory: desktop/src-tauri
        run: cargo test --locked

  audit:
    name: audit
    if: ${{ !startsWith(github.ref, 'refs/tags/') }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm audit --omit=dev --audit-level=high
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit
      - working-directory: desktop/src-tauri
        run: cargo audit

  bundle:
    name: installers (${{ matrix.name }})
    needs: [frontend, rust]
    # Also runs for tags, where the check jobs above are skipped.
    if: ${{ !cancelled() && !failure() }}
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: macOS, os: macos-15, args: --target aarch64-apple-darwin, artifact: gavia-macos-arm64 }
          - { name: Windows, os: windows-2025, args: '', artifact: gavia-windows-x64 }
          - { name: Linux, os: ubuntu-24.04, args: '', artifact: gavia-linux-x64 }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-desktop-build
      - name: Build
        shell: bash
        run: npx tauri build ${{ matrix.args }}
      # See make-dmg.sh for why the .dmg is not Tauri's; it also refuses to
      # package a bundle whose signature would abort the file picker.
      - name: Package the .dmg
        if: runner.os == 'macOS'
        run: bash scripts/make-dmg.sh
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          # Each system produces only its own kinds; the rest match nothing.
          path: |
            desktop/src-tauri/target/**/release/bundle/dmg/*.dmg
            desktop/src-tauri/target/**/release/bundle/nsis/*.exe
            desktop/src-tauri/target/**/release/bundle/deb/*.deb
            desktop/src-tauri/target/**/release/bundle/rpm/*.rpm
            desktop/src-tauri/target/**/release/bundle/appimage/*.AppImage
          if-no-files-found: error
      - name: Attach to the release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        working-directory: desktop/src-tauri/target
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # macOS ships bash 3.2, so no globstar: list both output depths.
          shopt -s nullglob
          files=({,*/}release/bundle/{dmg/*.dmg,nsis/*.exe,deb/*.deb,rpm/*.rpm,appimage/*.AppImage})
          gh release upload "$GITHUB_REF_NAME" "${files[@]}" --clobber
